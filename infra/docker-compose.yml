# RLogistics + RLogisticsGENIE local stack — Redis + Qdrant + GENIE API
# Usage: docker compose -f infra/docker-compose.yml up -d
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  genie:
    build:
      context: ../src/RLogisticsGENIE
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      RLOGISTICS_URL: http://host.docker.internal:5088
      RLOGISTICS_API_KEY: rlogistics-demo-coord-key-change-me
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      GENIE_LLM_MODE: offline
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o-mini}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  qdrant_data:
